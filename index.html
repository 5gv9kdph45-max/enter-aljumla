<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71932"><title>سنتر الجملة</title><style>body{margin:0;background:#f5f5f6;font:15px system-ui;color:#222}header{background:#d71932;color:white;padding:22px 16px}h1{margin:0;font-size:25px}main{max-width:700px;margin:auto;padding:14px}.tabs,.cats{display:flex;gap:8px;overflow:auto;margin:12px 0}button{border:0;border-radius:10px;padding:11px;cursor:pointer;font:inherit}.tabs button,.cats button{background:white;white-space:nowrap}.active,.buy{background:#d71932!important;color:white!important}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.panel{background:white;border-radius:14px;padding:13px;margin-bottom:12px;box-shadow:0 1px 5px #0001}.emoji{font-size:54px;text-align:center;background:#f7f7f7;border-radius:12px;padding:15px}.price{color:#c9142e;font-weight:800}input,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:9px;font:inherit}.buy{width:100%;margin-top:8px}.line{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.muted{color:#777;font-size:12px}footer{text-align:center;color:#777;font-size:12px;padding:20px}</style></head><body><header><h1>سنتر الجملة</h1><div>موبايلات • إكسسوارات • أرصدة</div></header><main><div class="tabs"><button onclick="view='shop';render()">المتجر</button><button onclick="view='cart';render()">السلة <span id="count"></span></button><button onclick="view='admin';render()">الإدارة التجريبية</button></div><section id="app"></section></main><footer>نسخة تجريبية فقط — لا توجد طلبات أو مدفوعات حقيقية</footer><script>
const initial=[['آيفون 16 برو ماكس',1550000,'موبايلات','📱'],['سامسونگ A56',435000,'موبايلات','📱'],['شاحن سريع',18000,'إكسسوارات','🔌'],['سماعات بلوتوث',35000,'إكسسوارات','🎧'],['كفر حماية',12000,'إكسسوارات','🛡️'],['باور بانك',42000,'إكسسوارات','🔋'],['رصيد آسياسيل 10000',10000,'أرصدة','📶'],['رصيد زين 5000',5000,'أرصدة','📶'],['رصيد كورك 10000',10000,'أرصدة','📶']];let products=initial.map((p,i)=>({id:i+1,name:p[0],price:p[1],cat:p[2],emoji:p[3]})),cart={},orders=[],view='shop',cat='الكل';const el=document.getElementById('app'),fmt=n=>Number(n).toLocaleString('en-US')+' د.ع',safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function total(){return Object.entries(cart).reduce((s,[id,q])=>s+(products.find(p=>p.id==id)?.price||0)*q,0)}function add(id){cart[id]=(cart[id]||0)+1;render()}function change(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);render()}function render(){document.getElementById('count').textContent=Object.values(cart).reduce((a,b)=>a+b,0);if(view==='shop'){el.innerHTML='<div class="panel"><b>عروض سنتر الجملة</b><p>تسوق من منتجاتنا التجريبية</p></div><input id="search" placeholder="ابحث عن منتج" oninput="showProducts()"><div class="cats">'+['الكل','موبايلات','إكسسوارات','أرصدة'].map(c=>`<button class="${cat===c?'active':''}" onclick="cat='${c}';render()">${c}</button>`).join('')+'</div><div class="grid" id="products"></div>';showProducts()}else if(view==='cart'){let items=Object.entries(cart).filter(([id,q])=>q>0);el.innerHTML='<h2>سلة المشتريات</h2>'+ (items.length?items.map(([id,q])=>{let p=products.find(x=>x.id==id);return `<div class="panel line"><span>${safe(p.name)}<br><small>${fmt(p.price)}</small></span><span><button onclick="change(${id},-1)">−</button> ${q} <button onclick="change(${id},1)">+</button></span></div>`}).join('')+`<div class="panel"><b>المجموع: ${fmt(total())}</b><p class="muted">أجور التوصيل تحدد لاحقاً</p><button class="buy" onclick="view='checkout';render()">إتمام الطلب</button></div>`:'<p>السلة فارغة</p>')}else if(view==='checkout'){let recharge=Object.keys(cart).some(id=>cart[id]>0&&products.find(p=>p.id==id)?.cat==='أرصدة');el.innerHTML=`<h2>طلب تجريبي</h2><form class="panel" onsubmit="submitOrder(event)"><input name="name" required placeholder="اسم الزبون"><input name="phone" required placeholder="رقم الهاتف" inputmode="tel"><input name="address" placeholder="المحافظة والمنطقة والعنوان">${recharge?'<input name="topup" required placeholder="رقم الهاتف المطلوب تعبئته">':''}<label>طريقة الدفع</label><select><option>الدفع عند الاستلام (تجريبي)</option><option disabled>الدفع الإلكتروني — غير مفعل</option></select><b>المجموع: ${fmt(total())}</b><button class="buy">تأكيد الطلب التجريبي</button></form>`}else if(view==='admin'){el.innerHTML='<h2>لوحة الإدارة التجريبية</h2><div class="panel"><b>إضافة منتج</b><form onsubmit="newProduct(event)"><input name="name" required placeholder="اسم المنتج"><input name="price" type="number" min="1" required placeholder="السعر بالدينار"><select name="cat"><option>موبايلات</option><option>إكسسوارات</option><option>أرصدة</option></select><button class="buy">إضافة</button></form></div><h3>الطلبات التجريبية</h3>'+ (orders.length?orders.map((o,i)=>`<div class="panel"><b>طلب #${i+1}</b><p>${safe(o.name)} — ${safe(o.phone)}</p><p>${safe(o.address)} ${o.topup?' | تعبئة: '+safe(o.topup):''}</p><b>${fmt(o.total)}</b><select onchange="orders[${i}].status=this.value"><option>جديد</option><option>قيد التجهيز</option><option>مكتمل</option></select></div>`).join(''):'<p>لا توجد طلبات بعد</p>')}else{el.innerHTML='<div class="panel">تم إنشاء الطلب التجريبي بنجاح. لم يُرسل لأي متجر.</div><button class="buy" onclick="view=\'shop\';render()">العودة للمتجر</button>'}}function showProducts(){let term=document.getElementById('search')?.value||'';document.getElementById('products').innerHTML=products.filter(p=>(cat==='الكل'||p.cat===cat)&&p.name.includes(term)).map(p=>`<div class="card"><div class="emoji">${p.emoji}</div><b>${safe(p.name)}</b><p class="price">${fmt(p.price)}</p><button class="buy" onclick="add(${p.id})">أضف للسلة</button></div>`).join('')||'<p>لا توجد نتائج</p>'}function submitOrder(e){e.preventDefault();let d=new FormData(e.target);orders.push({name:d.get('name'),phone:d.get('phone'),address:d.get('address'),topup:d.get('topup'),total:total(),status:'جديد'});cart={};view='done';render()}function newProduct(e){e.preventDefault();let d=new FormData(e.target),c=d.get('cat');products.push({id:Date.now(),name:d.get('name'),price:+d.get('price'),cat:c,emoji:c==='موبايلات'?'📱':c==='أرصدة'?'📶':'🎧'});e.target.reset();render()}render();
</script></body></html>
